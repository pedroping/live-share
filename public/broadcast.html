<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transmitir</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; text-align: center; }
  button {
    padding: 14px 24px; font-size: 18px; border: none; border-radius: 8px;
    background: #2563eb; color: white; cursor: pointer;
  }
  button:disabled { background: #93c5fd; cursor: default; }
  #codeBox { margin: 20px 0; padding: 16px; background: #f1f5f9; border-radius: 8px; }
  #codeDisplay { font-size: 40px; letter-spacing: 6px; margin: 4px 0; font-weight: 700; }
  .link-row { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; margin: 8px 0; }
  #watchLink {
    font-size: 14px; color: #334155; word-break: break-all; background: white;
    border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px 10px;
  }
  button.small { padding: 8px 14px; font-size: 14px; }
  #copyBtn.copied { background: #16a34a; }
  #controls { margin-top: 16px; display: none; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; }
  #switchBtn { background: #475569; }
  .audio-row { margin-top: 16px; display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; font-size: 15px; }
  #audioSource {
    padding: 8px 10px; font-size: 14px; border: 1px solid #cbd5e1; border-radius: 6px;
    background: white; max-width: 100%;
  }
  #audioStatus { font-size: 14px; color: #475569; margin-top: 8px; min-height: 20px; }
  #audioStatus.off { color: #b45309; }
  .server-status { font-size: 14px; color: #b45309; min-height: 0; margin: 10px 0 0; }
  .server-status:empty { display: none; }
  .hint { font-size: 13px; color: #64748b; max-width: 560px; margin: 10px auto 0; }
  video { width: 100%; margin-top: 20px; border-radius: 8px; background: #000; aspect-ratio: 16 / 9; }
  a.back { display: inline-block; margin-bottom: 10px; color: #2563eb; text-decoration: none; }
</style>
</head>
<body>
  <a class="back" href="/">← Voltar</a>
  <h1>Iniciar transmissão</h1>
  <button id="startBtn">Compartilhar tela</button>
  <p class="server-status" id="serverStatus"></p>

  <div class="audio-row">
    <label for="audioSource">🔊 Fonte de áudio:</label>
    <select id="audioSource"></select>
  </div>
  <div id="audioStatus"></div>
  <p class="hint" id="audioHint"></p>

  <div id="codeBox" style="display:none">
    <p>Código da sala:</p>
    <div id="codeDisplay"></div>
    <div class="link-row">
      <span id="watchLink"></span>
      <button id="copyBtn" class="small" type="button">📋 Copiar link</button>
    </div>
    <p id="viewerCount">Espectadores conectados: 0</p>
  </div>

  <div id="controls">
    <button id="switchBtn" class="small" type="button">🔄 Trocar fonte de vídeo</button>
  </div>

  <video id="preview" autoplay muted playsinline></video>

<script src="/server-wake.js"></script>
<script src="/clip-buffer.js"></script>
<script src="/clip-recorder.js"></script>
<script>
const startBtn = document.getElementById('startBtn');
const codeBox = document.getElementById('codeBox');
const codeDisplay = document.getElementById('codeDisplay');
const watchLink = document.getElementById('watchLink');
const copyBtn = document.getElementById('copyBtn');
const controls = document.getElementById('controls');
const switchBtn = document.getElementById('switchBtn');
const audioSelect = document.getElementById('audioSource');
const audioStatus = document.getElementById('audioStatus');
const audioHint = document.getElementById('audioHint');
const viewerCountEl = document.getElementById('viewerCount');
const preview = document.getElementById('preview');

let ws;
let displayStream;   // current getDisplayMedia capture (video + maybe its audio)
let deviceStream;    // current getUserMedia capture when an input device is chosen
let liveStream;      // what is actually sent: display video + chosen audio
let clipRecorder;
let broadcasting = false;
const peers = new Map(); // viewerId -> RTCPeerConnection
// One stable outbound stream id, so viewers keep the same MediaStream when
// tracks are swapped underneath it.
const outboundStream = new MediaStream();

// Audio modes: 'display' (system/tab audio from the screen picker),
// 'none', or 'device:<deviceId>' (a mic or virtual cable like CABLE Output).
const AUDIO_DISPLAY = 'display';
const AUDIO_NONE = 'none';
const AUDIO_GRANT = 'grant';
let audioMode = AUDIO_DISPLAY;

const iceServers = [{ urls: 'stun:stun.l.google.com:19302' }];
const MAX_WEBRTC_VIDEO_BITRATE = 8_000_000;
const MAX_WEBRTC_AUDIO_BITRATE = 192_000;
const CLIP_VIDEO_BITRATE = 6_000_000;
// Raw audio: voice-call processing mangles music and games.
const RAW_AUDIO = { echoCancellation: false, noiseSuppression: false, autoGainControl: false };

function displayOptions() {
  const wantAudio = audioMode === AUDIO_DISPLAY;
  return {
    video: {
      width: { ideal: 1920, max: 1920 },
      height: { ideal: 1080, max: 1080 },
      frameRate: { ideal: 30, max: 30 },
    },
    audio: wantAudio ? { ...RAW_AUDIO, suppressLocalAudioPlayback: false } : false,
    systemAudio: wantAudio ? 'include' : 'exclude',
    windowAudio: wantAudio ? 'system' : 'exclude',
    monitorTypeSurfaces: 'include',
    surfaceSwitching: 'include',
    selfBrowserSurface: 'exclude',
  };
}

// Prefer H264 (usually hardware-encoded on the GPU) over the browser's default
// VP8 (CPU only). Resolution, bitrate and frame rate are unchanged.
function preferHardwareCodec(pc) {
  const transceiver = pc.getTransceivers().find((t) => t.sender?.track?.kind === 'video');
  if (!transceiver || typeof transceiver.setCodecPreferences !== 'function') return;
  const codecs = RTCRtpSender.getCapabilities?.('video')?.codecs;
  if (!codecs?.length) return;
  const h264 = codecs.filter((c) => c.mimeType.toLowerCase() === 'video/h264');
  if (h264.length === 0) return;
  const others = codecs.filter((c) => c.mimeType.toLowerCase() !== 'video/h264');
  try {
    transceiver.setCodecPreferences([...h264, ...others]);
  } catch (error) {
    console.warn('Não foi possível definir preferência de codec:', error);
  }
}

function sendSignal(message) {
  if (!ws || ws.readyState !== WebSocket.OPEN) return false;
  ws.send(JSON.stringify(message));
  return true;
}

function updateViewerCount() {
  viewerCountEl.textContent = `Espectadores conectados: ${peers.size}`;
}

// ---------- copy link ----------
copyBtn.addEventListener('click', async () => {
  const link = watchLink.textContent;
  try {
    await navigator.clipboard.writeText(link);
  } catch {
    const range = document.createRange();
    range.selectNodeContents(watchLink);
    const selection = getSelection();
    selection.removeAllRanges();
    selection.addRange(range);
    document.execCommand('copy');
    selection.removeAllRanges();
  }
  copyBtn.textContent = '✅ Copiado!';
  copyBtn.classList.add('copied');
  clearTimeout(copyBtn.resetTimer);
  copyBtn.resetTimer = setTimeout(() => {
    copyBtn.textContent = '📋 Copiar link';
    copyBtn.classList.remove('copied');
  }, 2000);
});

// ---------- audio source picker ----------
async function refreshAudioDevices() {
  let devices = [];
  try {
    devices = (await navigator.mediaDevices.enumerateDevices()).filter((d) => d.kind === 'audioinput');
  } catch {}
  const labelled = devices.some((d) => d.label);

  const options = [
    [AUDIO_DISPLAY, 'Áudio do sistema / aba (da captura de tela)'],
    [AUDIO_NONE, 'Sem áudio'],
  ];
  if (labelled) {
    devices
      .filter((d) => d.deviceId && d.deviceId !== 'default' && d.deviceId !== 'communications')
      .forEach((d) => options.push([`device:${d.deviceId}`, `🎚️ ${d.label}`]));
  } else {
    options.push([AUDIO_GRANT, '🎚️ Usar um dispositivo de entrada… (pede permissão)']);
  }

  audioSelect.innerHTML = '';
  for (const [value, label] of options) {
    const option = document.createElement('option');
    option.value = value;
    option.textContent = label;
    audioSelect.appendChild(option);
  }
  // Keep the current choice if it still exists; otherwise fall back.
  if ([...audioSelect.options].some((o) => o.value === audioMode)) {
    audioSelect.value = audioMode;
  } else {
    if (audioMode.startsWith('device:')) await setAudioMode(AUDIO_NONE);
    audioSelect.value = audioMode;
  }
  updateAudioHint();
}

function updateAudioHint() {
  if (audioMode === AUDIO_DISPLAY) {
    audioHint.innerHTML = 'Escolha <b>Tela inteira</b> e marque <b>Compartilhar áudio do sistema</b> para enviar ' +
      'todo o som do computador (Chrome/Edge no Windows), ou escolha uma <b>Aba</b> para enviar só o som dela.';
  } else if (audioMode.startsWith('device:')) {
    audioHint.innerHTML = 'Só o som desse dispositivo é enviado. Para excluir o Discord: mande o jogo/música para ' +
      '<b>CABLE Input</b> (VB-Cable) no Mixer de volume do Windows e escolha <b>CABLE Output</b> aqui.';
  } else {
    audioHint.textContent = '';
  }
}

function showAudioStatus() {
  if (!broadcasting) {
    audioStatus.textContent = '';
    return;
  }
  const track = liveStream?.getAudioTracks()[0];
  let text;
  if (track) {
    text = `🔊 Enviando áudio: ${track.label || 'áudio'}`;
  } else if (audioMode === AUDIO_DISPLAY) {
    text = '🔇 A captura atual não tem áudio. Use "Trocar fonte de vídeo" e marque "Compartilhar áudio".';
  } else {
    text = '🔇 Sem áudio';
  }
  audioStatus.textContent = text;
  audioStatus.classList.toggle('off', !track);
}

async function openDevice(deviceId) {
  return navigator.mediaDevices.getUserMedia({
    audio: { deviceId: { exact: deviceId }, ...RAW_AUDIO, channelCount: { ideal: 2 }, sampleRate: { ideal: 48000 } },
    video: false,
  });
}

async function setAudioMode(mode) {
  const previousDevice = deviceStream;
  let nextDevice = null;
  if (mode.startsWith('device:')) {
    nextDevice = await openDevice(mode.slice('device:'.length));
    const track = nextDevice.getAudioTracks()[0];
    if (track && 'contentHint' in track) track.contentHint = 'music';
    track?.addEventListener('ended', () => {
      // Device unplugged: drop to no audio rather than breaking the stream.
      if (deviceStream === nextDevice) {
        setAudioMode(AUDIO_NONE).then(() => { audioSelect.value = AUDIO_NONE; updateAudioHint(); });
      }
    });
  }
  deviceStream = nextDevice;
  audioMode = mode;
  if (broadcasting) await applyLiveStream();
  if (previousDevice && previousDevice !== nextDevice) previousDevice.getTracks().forEach((t) => t.stop());
  showAudioStatus();
}

audioSelect.addEventListener('change', async () => {
  const value = audioSelect.value;
  audioSelect.disabled = true;
  try {
    if (value === AUDIO_GRANT) {
      // Device names are hidden until the site has microphone permission.
      const probe = await navigator.mediaDevices.getUserMedia({ audio: true });
      probe.getTracks().forEach((t) => t.stop());
      await refreshAudioDevices();
      const firstDevice = [...audioSelect.options].find((o) => o.value.startsWith('device:'));
      audioSelect.value = firstDevice ? firstDevice.value : audioMode;
      if (firstDevice) await setAudioMode(firstDevice.value);
    } else {
      await setAudioMode(value);
    }
  } catch (error) {
    alert('Não foi possível usar essa fonte de áudio: ' + error.message);
    audioSelect.value = audioMode;
  } finally {
    audioSelect.disabled = false;
    updateAudioHint();
  }
});

navigator.mediaDevices.addEventListener?.('devicechange', refreshAudioDevices);
refreshAudioDevices();

// ---------- composing the live stream ----------
function currentAudioTrack() {
  if (audioMode === AUDIO_DISPLAY) return displayStream?.getAudioTracks()[0] || null;
  if (audioMode.startsWith('device:')) return deviceStream?.getAudioTracks()[0] || null;
  return null;
}

// Rebuild what is sent from the current video + audio choice and push it to
// every viewer and to the clip recorder, without touching the room.
async function applyLiveStream() {
  const tracks = [displayStream.getVideoTracks()[0], currentAudioTrack()].filter(Boolean);
  liveStream = new MediaStream(tracks);
  preview.srcObject = liveStream;

  outboundStream.getTracks().forEach((t) => outboundStream.removeTrack(t));
  tracks.forEach((t) => outboundStream.addTrack(t));

  await Promise.all([...peers.values()].map((pc) => swapTracks(pc, liveStream)));
  await clipRecorder?.setStream(liveStream);
  showAudioStatus();
}

// ---------- capture ----------
async function captureScreen() {
  const stream = await navigator.mediaDevices.getDisplayMedia(displayOptions());
  const videoTrack = stream.getVideoTracks()[0];
  if ('contentHint' in videoTrack) videoTrack.contentHint = 'detail';
  const audioTrack = stream.getAudioTracks()[0];
  if (audioTrack && 'contentHint' in audioTrack) audioTrack.contentHint = 'music';
  return stream;
}

// The browser's own "Stop sharing" button ends the broadcast.
function onCaptureEnded() {
  clipRecorder?.stop();
  broadcasting = false;
  deviceStream?.getTracks().forEach((t) => t.stop());
  if (ws?.readyState === WebSocket.OPEN) ws.close();
  location.reload();
}

function useDisplayStream(stream) {
  const previous = displayStream;
  previous?.getVideoTracks()[0]?.removeEventListener('ended', onCaptureEnded);
  displayStream = stream;
  stream.getVideoTracks()[0].addEventListener('ended', onCaptureEnded);
  return previous;
}

startBtn.addEventListener('click', async () => {
  let stream;
  try {
    stream = await captureScreen();
  } catch (err) {
    alert('Não foi possível capturar a tela: ' + err.message);
    return;
  }

  useDisplayStream(stream);
  broadcasting = true;
  await applyLiveStream();
  startBtn.style.display = 'none';
  controls.style.display = 'flex';

  // The tab may have been open for a while and the free server gone to sleep.
  const serverStatus = document.getElementById('serverStatus');
  const awake = await ServerWake.wakeServer('', {
    onStatus: (s) => { serverStatus.textContent = ServerWake.describe(s); },
  });
  if (!awake) {
    broadcasting = false;
    stream.getTracks().forEach((t) => t.stop());
    alert(ServerWake.describe({ state: 'offline' }));
    location.reload();
    return;
  }
  ServerWake.keepAlive('');
  connectSignaling();
});

switchBtn.addEventListener('click', async () => {
  switchBtn.disabled = true;
  let stream;
  try {
    stream = await captureScreen();
  } catch (err) {
    // Picker cancelled: keep sharing the current source.
    switchBtn.disabled = false;
    return;
  }

  const previous = useDisplayStream(stream);
  try {
    await applyLiveStream();
  } catch (error) {
    console.error('Erro ao trocar a fonte:', error);
  } finally {
    previous?.getTracks().forEach((t) => t.stop());
    switchBtn.disabled = false;
  }
});

// Swap tracks on an existing connection. replaceTrack needs no renegotiation;
// only a brand-new kind (audio appearing for the first time) does.
async function swapTracks(pc, stream) {
  let needsOffer = false;
  for (const kind of ['video', 'audio']) {
    const track = stream.getTracks().find((t) => t.kind === kind) || null;
    const sender = pc.getSenders().find((s) => s.kindHint === kind);
    if (sender) {
      await sender.replaceTrack(track);
    } else if (track) {
      const newSender = pc.addTrack(track, outboundStream);
      newSender.kindHint = kind;
      needsOffer = true;
    }
  }
  if (needsOffer) {
    await sendOffer(pc);
    await applySenderLimits(pc);
  }
}

// ---------- signaling ----------
function connectSignaling() {
  ws = new WebSocket(location.origin.replace(/^http/, 'ws'));

  ws.onopen = () => sendSignal({ type: 'create-room' });

  ws.onmessage = async (event) => {
    const msg = JSON.parse(event.data);

    if (msg.type === 'room-created') {
      codeBox.style.display = 'block';
      codeDisplay.textContent = msg.code;
      watchLink.textContent = `${location.origin}/watch.html?code=${msg.code}`;
    } else if (msg.type === 'viewer-joined') {
      ensureClipRecorder();
      await addViewer(msg.viewerId);
    } else if (msg.type === 'answer') {
      const pc = peers.get(msg.from);
      if (pc) await pc.setRemoteDescription(new RTCSessionDescription(msg.sdp));
    } else if (msg.type === 'ice-candidate') {
      const pc = peers.get(msg.from);
      if (pc && msg.candidate) {
        try { await pc.addIceCandidate(new RTCIceCandidate(msg.candidate)); } catch (e) {}
      }
    } else if (msg.type === 'viewer-left') {
      const pc = peers.get(msg.viewerId);
      if (pc) { pc.close(); peers.delete(msg.viewerId); }
      stopClipRecorderWithoutViewers();
      updateViewerCount();
    } else if (msg.type === 'clip-request') {
      uploadRequestedClip(msg);
    }
  };

  ws.onclose = () => {
    if (broadcasting) alert('Conexão com o servidor perdida. Recarregue para transmitir de novo.');
  };
}

// ---------- clips ----------
function ensureClipRecorder() {
  if (clipRecorder) return;
  clipRecorder = new RollingClipRecorder(liveStream, { videoBitsPerSecond: CLIP_VIDEO_BITRATE });
  clipRecorder.start();
}

function stopClipRecorderWithoutViewers() {
  if (peers.size > 0 || !clipRecorder) return;
  clipRecorder.stop();
  clipRecorder = null;
}

async function uploadRequestedClip({ requestId, duration }) {
  if (!clipRecorder) {
    sendSignal({ type: 'clip-upload-failed', requestId });
    return;
  }

  try {
    const selection = await clipRecorder.select(duration);
    if (selection.segments.length === 0) throw new Error('Nenhum segmento disponível.');

    const formData = new FormData();
    selection.segments.forEach((segment, index) => {
      formData.append('videos', segment.blob, `segmento-${index}.webm`);
    });
    formData.append('startOffsetMs', String(selection.startOffsetMs));
    formData.append('segmentDurationsMs', JSON.stringify(selection.segments.map((s) => s.durationMs)));

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 240_000);
    try {
      const response = await fetch('/api/clips', {
        method: 'POST',
        headers: { 'X-Clip-Request': requestId },
        body: formData,
        signal: controller.signal,
      });
      if (!response.ok) throw new Error(`Falha ao processar clipe (HTTP ${response.status}).`);
    } finally {
      clearTimeout(timeout);
    }
  } catch (error) {
    console.error('Erro ao preparar clipe solicitado:', error);
    sendSignal({ type: 'clip-upload-failed', requestId });
  }
}

// ---------- peers ----------
async function sendOffer(pc) {
  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
  sendSignal({ type: 'offer', target: pc.viewerId, sdp: offer });
}

async function applySenderLimits(pc) {
  for (const sender of pc.getSenders()) {
    const limit = sender.kindHint === 'video' ? MAX_WEBRTC_VIDEO_BITRATE
      : sender.kindHint === 'audio' ? MAX_WEBRTC_AUDIO_BITRATE : 0;
    if (!limit) continue;
    const parameters = sender.getParameters();
    if (!parameters.encodings?.length) parameters.encodings = [{}];
    parameters.encodings[0].maxBitrate = limit;
    if (sender.kindHint === 'video') parameters.encodings[0].maxFramerate = 30;
    await sender.setParameters(parameters).catch((error) => {
      console.warn('O navegador não aplicou o limite de bitrate:', error);
    });
  }
}

async function addViewer(viewerId) {
  const pc = new RTCPeerConnection({ iceServers });
  pc.viewerId = viewerId;
  peers.set(viewerId, pc);

  liveStream.getTracks().forEach((track) => {
    const sender = pc.addTrack(track, outboundStream);
    sender.kindHint = track.kind;
  });
  preferHardwareCodec(pc);
  await applySenderLimits(pc);

  pc.addEventListener('connectionstatechange', () => {
    if (['failed', 'closed'].includes(pc.connectionState)) {
      pc.close();
      peers.delete(viewerId);
      stopClipRecorderWithoutViewers();
      updateViewerCount();
    }
  });

  pc.onicecandidate = (event) => {
    if (event.candidate) sendSignal({ type: 'ice-candidate', target: viewerId, candidate: event.candidate });
  };

  await sendOffer(pc);
  updateViewerCount();
}
</script>
</body>
</html>
