<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transmitir</title>
<link rel="stylesheet" href="/css/site.css">
</head>
<body class="page-broadcast">
  <a class="back" href="/">← Voltar</a>
  <h1>Iniciar transmissão</h1>
  <button id="startBtn">Compartilhar tela</button>
  <p class="server-status" id="serverStatus"></p>

  <div class="audio-row">
    <label for="audioSource">🔊 Fonte de áudio:</label>
    <select id="audioSource"></select>
  </div>
  <div id="audioStatus"></div>
  <p class="hint" id="audioHint"></p>

  <div id="codeBox" style="display:none">
    <p>Código da sala:</p>
    <div id="codeDisplay"></div>
    <div class="link-row">
      <span id="watchLink"></span>
      <button id="copyBtn" class="small" type="button">📋 Copiar link</button>
    </div>
    <p id="viewerCount">Espectadores conectados: 0</p>
  </div>

  <div id="controls">
    <button id="switchBtn" class="small" type="button">🔄 Trocar fonte de vídeo</button>
  </div>

  <video id="preview" autoplay muted playsinline></video>

<script src="/js/server-wake.js"></script>
<script src="/js/clip-buffer.js"></script>
<script src="/js/clip-recorder.js"></script>
<script src="/js/broadcast-session.js"></script>
<script src="/js/broadcast-page.js"></script>
</body>
</html>
