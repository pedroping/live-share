<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistir</title>
<link rel="stylesheet" href="/css/site.css">
</head>
<body class="page-watch">
  <a class="back" href="/">← Voltar</a>
  <h1>Assistir transmissão</h1>
  <div id="joinBox">
    <input id="codeInput" placeholder="Código" maxlength="4" autocomplete="off">
    <button id="joinBtn">Entrar</button>
    <p id="errorMsg"></p>
    <p class="server-status" id="serverStatus"></p>
  </div>

  <video id="remoteVideo" autoplay playsinline controls style="display:none"></video>

  <div id="clipBar">
    <button id="clip30Btn">🎬 Clipar últimos 30s</button>
    <button id="clip60Btn">🎬 Clipar últimos 60s</button>
    <div id="clipStatus"></div>
  </div>

  <p><a href="/clips.html">Ver todos os clipes salvos →</a></p>

<script src="/js/server-wake.js"></script>
<script src="/js/watch-page.js"></script>
</body>
</html>
