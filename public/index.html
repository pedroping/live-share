<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transmissão de tela</title>
<link rel="stylesheet" href="/css/site.css">
</head>
<body class="page-home">
  <h1>Transmissão de tela</h1>
  <p>Escolha uma opção:</p>
  <a class="btn" href="/broadcast.html">Iniciar transmissão</a>
  <a class="btn secondary" href="/watch.html">Assistir com um código</a>

  <div class="clips-section">
    <h2>Clipes recentes</h2>
    <p id="clipsStatus">Carregando...</p>
    <div class="grid" id="clipsGrid"></div>
    <a class="see-all" href="/clips.html">Ver todos os clipes →</a>
  </div>

<script src="/js/server-wake.js"></script>
<script src="/js/clip-gallery.js"></script>
<script>
  renderClips({
    statusEl: document.getElementById('clipsStatus'),
    grid: document.getElementById('clipsGrid'),
    limit: 6,
    emptyText: 'Nenhum clipe salvo ainda. Assista uma transmissão e clipe um momento!',
  });
</script>
</body>
</html>
