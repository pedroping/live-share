<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy"
  content="default-src 'self'; script-src 'self' blob:; worker-src blob:; img-src 'self' data:; media-src 'self' blob: mediastream:; connect-src https: wss: http: ws:; style-src 'self' 'unsafe-inline'">
<title>Live Share</title>
<style>
  :root {
    --bg: #1e1f22; --panel: #2b2d31; --panel-2: #313338; --line: #3f4147;
    --text: #f2f3f5; --muted: #b5bac1; --faint: #80848e;
    --accent: #5865f2; --accent-hover: #4752c4; --live: #da373c; --ok: #23a55a; --warn: #f0b232;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 14px/1.4 "Segoe UI", system-ui, sans-serif; display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 20px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 700; }
  .pill { font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 4px; background: var(--line); color: var(--muted); }
  .pill.live { background: var(--live); color: white; }
  header .spacer { flex: 1; }
  button.pill { border: none; cursor: pointer; font-family: inherit; }
  .pill.online { background: rgba(35,165,90,.18); color: var(--ok); }
  .pill.waking { background: rgba(240,178,50,.18); color: var(--warn); }
  .pill.offline { background: rgba(218,55,60,.2); color: #f38688; }
  header label { color: var(--faint); font-size: 12px; }
  #serverUrl {
    width: 300px; background: var(--bg); border: 1px solid var(--line); color: var(--text);
    border-radius: 4px; padding: 6px 8px; font-size: 12px;
  }
  main { flex: 1; display: grid; grid-template-columns: 1fr 340px; min-height: 0; }
  .content { padding: 20px; overflow: auto; min-width: 0; }
  aside { background: var(--panel); border-left: 1px solid var(--line); padding: 20px; overflow: auto; display: flex; flex-direction: column; gap: 18px; }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 14px; }
  .tab {
    background: transparent; color: var(--muted); border: none; padding: 6px 12px; border-radius: 4px;
    font: inherit; font-weight: 600; cursor: pointer;
  }
  .tab.active, .tab:hover { background: var(--panel-2); color: var(--text); }
  .tabs .spacer { flex: 1; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; }
  .card {
    background: var(--panel); border: 2px solid transparent; border-radius: 8px; padding: 8px;
    cursor: pointer; text-align: left; color: inherit; font: inherit;
  }
  .card:hover { background: var(--panel-2); }
  .card.selected { border-color: var(--accent); }
  .card img.thumb { width: 100%; aspect-ratio: 16/9; object-fit: contain; background: #111214; border-radius: 4px; display: block; }
  .card .name { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13px; overflow: hidden; }
  .card .name span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .name img { width: 16px; height: 16px; flex: none; }
  .empty { color: var(--faint); padding: 40px 0; text-align: center; }
  select, .field {
    width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--line);
    border-radius: 4px; padding: 8px; font: inherit;
  }
  optgroup { color: var(--faint); }
  option { color: var(--text); }
  .note { font-size: 12px; color: var(--muted); margin-top: 8px; }
  .note.ok { color: var(--ok); }
  .note.warn { color: var(--warn); }
  .badge { display: flex; gap: 8px; align-items: flex-start; background: rgba(88,101,242,.12); border: 1px solid rgba(88,101,242,.4); border-radius: 6px; padding: 8px 10px; font-size: 12px; color: var(--text); margin-top: 8px; }
  button.primary, button.secondary, button.danger {
    border: none; border-radius: 4px; padding: 10px 14px; font: inherit; font-weight: 600; cursor: pointer; color: white; width: 100%;
  }
  button.primary { background: var(--accent); }
  button.primary:hover { background: var(--accent-hover); }
  button.primary:disabled { background: #3c4270; color: var(--faint); cursor: default; }
  button.secondary { background: var(--line); }
  button.secondary:hover { background: #4e5058; }
  button.danger { background: var(--live); }
  .row { display: flex; gap: 8px; }
  .live-box { background: var(--panel-2); border-radius: 8px; padding: 14px; }
  #code { font-size: 34px; font-weight: 800; letter-spacing: 6px; text-align: center; margin: 4px 0 10px; }
  #watchLink { font-size: 12px; color: var(--muted); word-break: break-all; background: var(--bg); padding: 8px; border-radius: 4px; margin-bottom: 8px; }
  #viewers { text-align: center; color: var(--muted); margin-top: 10px; }
  video { width: 100%; border-radius: 8px; background: #000; aspect-ratio: 16/9; display: block; }
  #liveView { display: none; }
  #liveView .head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  #liveView .head .spacer { flex: 1; }
  #liveView .head button { width: auto; }
  #pickerOverlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.7); padding: 40px; z-index: 10;
  }
  #pickerOverlay .dialog { background: var(--bg); border-radius: 8px; padding: 20px; height: 100%; overflow: auto; }
  #pickerOverlay .dialog .head { display: flex; align-items: center; margin-bottom: 12px; }
  #pickerOverlay .dialog .head h2 { flex: 1; margin: 0; }
  #pickerOverlay .dialog .head button { width: auto; }
  .meter { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin-top: 8px; }
  .meter div { height: 100%; width: 0; background: var(--ok); transition: width .1s; }
</style>
</head>
<body>
  <header>
    <h1>📡 Live Share</h1>
    <span class="pill" id="statePill">OFFLINE</span>
    <button class="pill" id="serverPill" title="Status do servidor (clique para verificar)">Servidor…</button>
    <div class="spacer"></div>
    <label for="serverUrl">Servidor</label>
    <input id="serverUrl" spellcheck="false">
  </header>

  <main>
    <section class="content">
      <div id="pickerView">
        <h2>Escolha o que transmitir</h2>
        <div id="pickerHost"></div>
      </div>

      <div id="liveView">
        <div class="head">
          <span class="pill live">● AO VIVO</span>
          <strong id="liveSourceName"></strong>
          <div class="spacer"></div>
          <button class="secondary" id="switchBtn">🔄 Trocar fonte</button>
        </div>
        <video id="preview" autoplay muted playsinline></video>
      </div>
    </section>

    <aside>
      <div>
        <h2>Áudio</h2>
        <select id="audioSelect"></select>
        <div class="meter"><div id="audioMeter"></div></div>
        <div class="note" id="audioNote"></div>
        <div class="badge" id="discordBadge" hidden>🎧 <span>Discord detectado: <b>sua call e os sons do Discord ficam fora da transmissão.</b> Todo o resto do áudio do PC é enviado.</span></div>
      </div>

      <div>
        <h2>Qualidade</h2>
        <select id="qualitySelect">
          <option value="720p30">720p · 30 fps</option>
          <option value="1080p30" selected>1080p · 30 fps</option>
          <option value="1080p60">1080p · 60 fps</option>
          <option value="1440p60">1440p · 60 fps</option>
        </select>
      </div>

      <div id="goLiveBox">
        <button class="primary" id="goLiveBtn" disabled>Ficar ao vivo</button>
        <div class="note" id="goLiveNote">Selecione uma tela ou janela.</div>
      </div>

      <div id="liveBox" class="live-box" hidden>
        <h2>Código da sala</h2>
        <div id="code">····</div>
        <div id="watchLink"></div>
        <div class="row">
          <button class="primary" id="copyBtn">📋 Copiar link</button>
          <button class="secondary" id="openBtn" title="Abrir no navegador">↗</button>
        </div>
        <div id="viewers">Espectadores: 0</div>
        <div style="margin-top:12px"><button class="danger" id="stopBtn">Encerrar transmissão</button></div>
      </div>
    </aside>
  </main>

  <div id="pickerOverlay">
    <div class="dialog">
      <div class="head">
        <h2>Trocar fonte</h2>
        <button class="secondary" id="closePickerBtn">Cancelar</button>
      </div>
      <div id="overlayPickerHost"></div>
    </div>
  </div>

  <template id="pickerTemplate">
    <div class="tabs">
      <button class="tab active" data-kind="window">Aplicativos</button>
      <button class="tab" data-kind="screen">Telas</button>
      <div class="spacer"></div>
      <button class="tab" data-action="refresh">↻ Atualizar</button>
    </div>
    <div class="grid"></div>
  </template>

<script src="shared/server-wake.js"></script>
<script src="shared/clip-buffer.js"></script>
<script src="shared/clip-recorder.js"></script>
<script src="pcm-worklet.js"></script>
<script src="app.js"></script>
</body>
</html>
